# Ollama local (IA de reserva), rodando na CPU. Uso:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull llama3.2:3b
# No backend/.env: AI_FALLBACK=ollama  (ou AI_PROVIDER=ollama para usar só o local)
# Obs.: esta máquina tem GPU AMD, que o Ollama não usa aqui; por isso o modelo é pequeno.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: aps-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
